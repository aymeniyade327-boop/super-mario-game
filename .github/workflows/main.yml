name: Build The Friends

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Create ZIP
        run: cd dist && zip -r ../the-friends.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: the-friends-build
          path: the-friends.zip
